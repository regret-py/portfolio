<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Julien</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2efe9">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
(function(){var t=null;try{t=localStorage.getItem('theme');}catch(e){}
if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2efe9;--text:#171512;--muted:#524d46;--dim:#6b655c;--rule:rgba(23,21,18,.13);--mark:#ff5a1f}
[data-theme="dark"]{--bg:#141311;--text:#ebe7de;--muted:#b0a99d;--dim:#8f887c;--rule:rgba(235,231,222,.12)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',ui-monospace,monospace;display:grid;place-items:center;padding:24px}
.wrap{width:min(520px,100%);border-top:1px solid var(--rule);padding-top:22px}
.code{font-size:13px;color:var(--dim);margin:0 0 18px;display:flex;align-items:center;gap:10px}
.code::before{content:"";width:8px;height:8px;background:var(--mark)}
h1{font-family:'IBM Plex Serif',Georgia,serif;font-weight:400;font-size:clamp(30px,6vw,42px);line-height:1.15;margin:0 0 14px}
p{color:var(--muted);font-family:system-ui,sans-serif;font-size:16px;line-height:1.6;margin:0 0 26px}
a{color:var(--text);font-size:14px;text-underline-offset:4px}
a:hover{color:var(--mark)}
</style>
</head>
<body>
  <main class="wrap">
    <p class="code">error 404</p>
    <h1 id="t">Nothing here.</h1>
    <p id="d">The link is broken or the page has moved.</p>
    <a href="/" id="b">← back to the homepage</a>
  </main>
<script>
  var L=null; try{ L=localStorage.getItem('lang'); }catch(e){}
  if(L==='fr'||(L!=='en'&&/^fr\b/i.test(navigator.language||''))){
    document.documentElement.lang='fr';
    document.getElementById('t').textContent='Rien ici.';
    document.getElementById('d').textContent='Le lien est cassé ou la page a changé d’adresse.';
    document.getElementById('b').textContent='← retour à l’accueil';
  }
</script>
</body>
</html>
